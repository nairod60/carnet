<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#14171D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Carnet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root {
    --ground: #F7F5EF; --surface: #FFFFFF; --surface-alt: #EEF1EA;
    --ink: #1E2430; --ink-2: #4E5666; --muted: #8A92A0;
    --line: #E6E4DC; --line-soft: #EFEDE6;
    --green: #3E9B5E; --green-tint: #E4F0E1;
    --blue: #3B6FD4; --blue-tint: #E3ECF7;
    --clay: #D9773F; --clay-tint: #FBE9DC;
    --ok: #3E9B5E;
    --rc: 22px; --rb: 14px;
    --shadow: 0 10px 28px -14px rgba(30,36,48,.18);
    --shadow-up: 0 -8px 24px -16px rgba(30,36,48,.18);
    --tab-h: 66px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #14171D; --surface: #1D2128; --surface-alt: #262B34;
      --ink: #EEF0F3; --ink-2: #B9BFC9; --muted: #7D8593;
      --line: #2F3540; --line-soft: #272C35;
      --green: #6FC28B; --green-tint: #1C2E22;
      --blue: #7FA6F0; --blue-tint: #1E2A3F;
      --clay: #F0A070; --clay-tint: #34261C;
      --ok: #6FC28B;
      --shadow: none; --shadow-up: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
  }
  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.025em; line-height: 1.08; text-wrap: balance; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 0 18px; }

  /* ---------- en-tête ---------- */
  .top { position: sticky; top: 0; z-index: 5; background: var(--ground); padding: calc(14px + env(safe-area-inset-top)) 0 8px; }
  .top .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .top h1 { font-size: 30px; }
  .top .sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; white-space: nowrap; background: var(--surface-alt); color: var(--ink-2); }
  .chip.green { background: var(--green-tint); color: var(--green); }
  .chip.blue { background: var(--blue-tint); color: var(--blue); }
  .chip.clay { background: var(--clay-tint); color: var(--clay); }
  .pill-kg { background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 16px; font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill-kg small { font-size: 12px; font-weight: 500; color: var(--muted); }

  /* ---------- sélecteurs de jour ---------- */
  .days { display: flex; gap: 8px; margin: 14px 0 4px; }
  .days button { flex: 1; min-height: 46px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: var(--ink-2); }
  .days button .l { font-size: 13px; font-weight: 700; }
  .days button .d { font-size: 10px; color: var(--muted); font-weight: 500; }
  .days button.on { background: var(--ink); color: #fff; }
  .days button.on .d { color: #fff; opacity: .65; }
  .days button.today:not(.on) { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--ink); }
  .days button.rest .l { color: var(--clay); } .days button.on.rest .l { color: #fff; }
  @media (prefers-color-scheme: dark) { .days button.on { background: var(--ink); color: var(--ground); } .days button.on .d { color: var(--ground); } .days button.on.rest .l { color: var(--ground); } }

  /* ---------- cartes ---------- */
  .card { background: var(--surface); border-radius: var(--rc); box-shadow: var(--shadow); margin: 12px 0; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .card { border: 1px solid var(--line-soft); } }
  .card-h { padding: 14px 18px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-h h3 { font-size: 17px; }
  .card-b { padding: 4px 18px 14px; }
  .card-h + .card-b { padding-top: 0; }

  /* ---------- exercice ---------- */
  .exo .grp { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
  .exo .cible { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); white-space: nowrap; margin-top: 2px; text-align: right; line-height: 1.4; }
  .exo .cible b { color: var(--ink); font-weight: 700; }
  .exo .cue { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 4px 0 6px; }
  .exo .picto { background: var(--surface-alt); border-radius: 14px; margin: 8px 0 4px; padding: 6px 0; display: flex; justify-content: center; }
  .exo .picto svg { width: 100%; max-width: 240px; height: auto; display: block; }
  .exo .picto img { width: 100%; height: auto; display: block; border-radius: 10px; }
  .exo .picto:has(img) { padding: 0; overflow: hidden; }
  .exo .last { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--muted); margin: 6px 0 2px; }
  .exo .last b { color: var(--ink); font-weight: 600; }
  .set { display: grid; grid-template-columns: 22px 1fr 1fr 46px; gap: 8px; align-items: center; padding: 6px 0; }
  .set + .set { border-top: 1px solid var(--line-soft); }
  .set.solo { grid-template-columns: 22px 1fr 46px; }  /* exercice sans charge : une seule case */
  .set .n { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); text-align: center; }
  .stepper { display: grid; grid-template-columns: 34px 1fr 34px; align-items: stretch; border-radius: var(--rb); overflow: hidden; background: var(--surface-alt); min-height: 46px; }
  .stepper button { font-family: "JetBrains Mono", monospace; font-size: 19px; color: var(--ink-2); }
  .stepper button:active { background: var(--line); }
  .stepper input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; }
  .stepper input::placeholder { color: var(--line); font-weight: 500; }
  .stepper .u { position: relative; }
  .stepper .u::after { content: attr(data-u); position: absolute; right: 5px; bottom: 4px; font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 500; color: var(--muted); pointer-events: none; }
  .done { width: 46px; height: 46px; border-radius: var(--rb); background: var(--surface-alt); display: flex; align-items: center; justify-content: center; color: transparent; }
  .done.on { background: var(--ok); color: #fff; }
  .done svg { width: 20px; height: 20px; }

  /* ---------- gros boutons ---------- */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; font-weight: 700; font-size: 16px; width: 100%; }
  .btn.primary { background: var(--ink); color: #fff; box-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { .btn.primary { color: var(--ground); } }
  .btn.primary:disabled { opacity: .35; box-shadow: none; }
  .btn.ghost { background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { .btn.ghost { border: 1px solid var(--line); } }
  .btn.small { min-height: 42px; font-size: 14px; width: auto; padding: 0 16px; }
  .btn.warn { color: var(--clay); }

  /* ---------- repas ---------- */
  .meal { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; padding: 13px 18px; align-items: start; }
  .meal + .meal { border-top: 1px solid var(--line-soft); }
  .meal .name { font-weight: 700; font-size: 15.5px; }
  .meal .plat { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .meal .k { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--green); font-weight: 600; white-space: nowrap; padding-top: 2px; text-align: right; }
  .meal ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .meal li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 10px; font-size: 14px; color: var(--ink-2); padding: 3px 0; }
  .meal li + li { border-top: 1px solid var(--line-soft); }
  .meal li .g { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; flex-shrink: 0; }
  .meal li .g em { font-style: normal; font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .meal li .n { flex-basis: 100%; font-family: "JetBrains Mono", monospace; font-style: normal; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.3; }
  .meal.ok .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .meal.ok li, .meal.ok li .g, .meal.ok .plat { color: var(--muted); }
  .cb { width: 28px; height: 28px; border-radius: 9px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; color: transparent; margin-top: 1px; }
  .cb.on { background: var(--green); color: #fff; }
  .cb svg { width: 16px; height: 16px; }
  .batch { background: var(--green-tint); border-radius: var(--rc); padding: 14px 18px; margin: 12px 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .batch .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .rest-day .batch { background: var(--clay-tint); } .rest-day .batch .eyebrow { color: var(--clay); }

  /* ---------- courses ---------- */
  .ray { padding: 8px 18px; }
  .ray .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 0 6px; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; min-height: 46px; padding: 3px 0; }
  .item + .item { border-top: 1px solid var(--line-soft); }
  .item .q { font-family: "JetBrains Mono", monospace; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .item.ok { color: var(--muted); } .item.ok span:first-of-type { text-decoration: line-through; text-decoration-color: var(--line); }
  .progress { height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; margin: 12px 0 4px; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .2s; }

  /* ---------- suivi ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 12px; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .verdict { border-radius: var(--rc); padding: 16px 18px; margin: 12px 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); background: var(--surface); box-shadow: var(--shadow); }
  .verdict .eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .verdict .big { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin-bottom: 4px; }
  .verdict.ok { background: var(--green-tint); box-shadow: none; } .verdict.ok .eyebrow { color: var(--green); }
  .verdict.warn { background: var(--clay-tint); box-shadow: none; } .verdict.warn .eyebrow { color: var(--clay); }
  .spark { width: 100%; height: 110px; display: block; }
  .rowline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; font-size: 14px; }
  .rowline + .rowline { border-top: 1px solid var(--line-soft); }
  .rowline .d { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .rowline .v { font-family: "JetBrains Mono", monospace; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar { display: grid; grid-template-columns: 56px 1fr 92px; gap: 8px; align-items: center; font-size: 12.5px; }
  .bar .d { font-family: "JetBrains Mono", monospace; color: var(--muted); }
  .bar .t { height: 10px; background: var(--surface-alt); border-radius: 5px; overflow: hidden; }
  .bar .t i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
  .bar .v { font-family: "JetBrains Mono", monospace; font-weight: 700; text-align: right; }

  /* ---------- minuteur ---------- */
  .timer { position: fixed; left: 18px; right: 18px; max-width: 484px; margin: 0 auto; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px); z-index: 6; background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 12px 10px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 16px 32px -10px rgba(30,36,48,.45); }
  @media (prefers-color-scheme: dark) { .timer { color: var(--ground); box-shadow: 0 16px 32px -10px rgba(0,0,0,.6); } }
  .timer .l { font-size: 12px; opacity: .65; font-weight: 500; }
  .timer .t { font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; }
  .timer button { width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,.14); font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .timer button { background: rgba(0,0,0,.18); } }
  .timer.over { background: var(--clay); color: #fff; }

  /* ---------- onglets ---------- */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 7; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); box-shadow: var(--shadow-up); display: grid; grid-template-columns: repeat(4, 1fr); }
  @media (prefers-color-scheme: dark) { nav.tabs { border-top: 1px solid var(--line-soft); } }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button.on { color: var(--ink); }

  details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; font-family: "JetBrains Mono", monospace; font-size: 16px; color: var(--muted); }
  details[open] summary::after { content: "−"; }
  .toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; box-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { .toast { color: var(--ground); } }
  .toast.show { opacity: 1; }
  .update { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 18px; right: 18px; max-width: 484px; margin: 0 auto; z-index: 8; background: var(--green); color: #fff; padding: 10px 10px 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow); }
  .update button { background: #fff; color: var(--green); font-weight: 700; border-radius: 999px; min-height: 40px; padding: 0 16px; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .hist { font-size: 13px; color: var(--muted); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<div id="timer" class="timer" hidden>
  <span class="l">repos</span><span class="t" id="timer-t">0:00</span>
  <button id="timer-add" aria-label="Ajouter 30 secondes">+30</button>
  <button id="timer-x" aria-label="Arrêter le minuteur">✕</button>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="update" class="update" hidden><span>Nouvelle version du plan disponible</span><button id="update-go">Mettre à jour</button></div>

<nav class="tabs" id="tabs">
  <button data-tab="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>Séance</button>
  <button data-tab="repas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 3v7a3 3 0 0 0 6 0V3M8 3v18M17 3c-2 1-3 4-3 8h3v10"/></svg>Repas</button>
  <button data-tab="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11l2-8H7M9 20a1 1 0 1 0 0 .1M18 20a1 1 0 1 0 0 .1"/></svg>Courses</button>
  <button data-tab="suivi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M4 16l5-6 4 3 7-8"/></svg>Suivi</button>
</nav>

<script>
// ============================================================ état
const KEY = "carnet.v1";
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const JC = ["L","M","M","J","V","S","D"];
let S = load();
function load() {
  const base = { seances: {}, courant: {}, repas: {}, courses: {}, poids: {}, taille: {}, mensurations: {}, moyennes: {}, compo: {}, avis: null, ajoutVu: null, tab: "seance", jourRepas: null, seanceOuverte: null };
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(base, JSON.parse(raw)); } catch (e) {}
  return base;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Impossible d'enregistrer : mémoire du navigateur bloquée"); } }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function dow(iso) { const d = iso ? new Date(iso + "T12:00:00") : new Date(); return (d.getDay() + 6) % 7; } // 0 = lundi
function fmtDate(iso) { const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
let toastT; function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

// ============================================================ minuteur de repos
let timer = { end: 0, id: null, over: false };
const tEl = document.getElementById("timer"), tT = document.getElementById("timer-t");
function startTimer(sec) {
  timer.end = Date.now() + sec * 1000; timer.over = false; tEl.hidden = false; tEl.classList.remove("over");
  audioReady(); // le clic sur « faite » autorise le son : le bip pourra jouer à la fin
  keepAwake(true);
  clearInterval(timer.id); timer.id = setInterval(tick, 250); tick();
}
// Écran maintenu allumé pendant le repos (appli Android), pour que le bip et la vibration arrivent
function keepAwake(on) { try { window.Android && Android.keepAwake && Android.keepAwake(!!on); } catch (e) {} }
function tick() {
  const left = Math.ceil((timer.end - Date.now()) / 1000);
  if (left <= 0) {
    tT.textContent = "0:00";
    if (!timer.over) { timer.over = true; tEl.classList.add("over"); beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    if (left < -30) stopTimer();
    return;
  }
  tT.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
}
function stopTimer() { clearInterval(timer.id); tEl.hidden = true; keepAwake(false); }
document.getElementById("timer-x").onclick = stopTimer;
document.getElementById("timer-add").onclick = () => { timer.end = Math.max(timer.end, Date.now()) + 30000; timer.over = false; tEl.classList.remove("over"); tick(); };
// "3 min" -> 180, "1 min 30" -> 90, "75 s" -> 75
function parseRepos(s) {
  const m = /(\d+)\s*min(?:\s*(\d+))?/.exec(s); if (m) return +m[1] * 60 + (+m[2] || 0);
  const n = /(\d+)/.exec(s); return n ? +n[1] : 60;
}
// Bip de fin de repos (Web Audio, débloqué par le clic qui lance le minuteur)
let audio = null;
function audioReady() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {} }
function beep() {
  try {
    audioReady(); if (!audio) return;
    const t0 = audio.currentTime;
    [0, 0.3, 0.6].forEach(d => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 1000;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
      o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 0.22);
    });
  } catch (e) {}
}

// ============================================================ navigation
const app = document.getElementById("app");
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.tab = b.dataset.tab; save(); render();
});
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  ({ seance: renderSeance, repas: renderRepas, courses: renderCourses, suivi: renderSuivi })[S.tab]();
  window.scrollTo(0, 0);
}

// ============================================================ SÉANCE
function seanceDuJour() { return DATA.seances.find(s => s.jourIdx === dow()) || null; }
function derniere(id) { const h = S.seances[id] || []; return h.length ? h[h.length - 1] : null; }
// Fourchette de répétitions d'un exercice : "8-10" -> {min 8, max 10}, "12" -> {12, 12}, "max" -> null
function fourchette(e) { const m = /(\d+)(?:\s*-\s*(\d+))?/.exec(e.reps); return m ? { min: +m[1], max: +(m[2] || m[1]) } : null; }
// Double progression : haut de la fourchette atteint sur toutes les séries la dernière fois -> +1 kg, reps en bas de la fourchette
function objectif(e, last, i) {
  if (!last || e.poidsCorps) return null;
  const f = fourchette(e); if (!f) return null;
  const done = (last.sets[i] || []).filter(x => x.done);
  if (done.length < e.series || !done.every(x => +x.r >= f.max && parseFloat(x.w) > 0)) return null;
  return { plus: 1, reps: f.min };
}
function courant(s) {
  if (!S.courant[s.id]) {
    const last = derniere(s.id);
    S.courant[s.id] = { date: today(), sets: s.exos.map((e, i) => {
      const o = objectif(e, last, i);
      return Array.from({ length: e.series }, (_, k) => {
        const l = last && last.sets[i] && last.sets[i][k];
        if (o && l && parseFloat(l.w) > 0) return { w: String(Math.round((parseFloat(l.w) + o.plus) * 10) / 10), r: String(o.reps), done: false };
        return { w: l ? l.w : "", r: l ? l.r : "", done: false };
      });
    }) };
  }
  // Le plan a pu changer depuis que la séance a été préparée (mise à jour de l'appli) :
  // on réaligne exercices et nombre de séries, sans toucher aux séries déjà cochées.
  const c = S.courant[s.id], last = derniere(s.id);
  c.exos = c.exos || [];
  let changed = false;
  s.exos.forEach((e, i) => {
    let sets = c.sets[i] || (c.sets[i] = []);
    if (c.exos[i] !== undefined && c.exos[i] !== e.nom && !sets.some(x => x.done)) { sets = c.sets[i] = []; changed = true; }
    if (c.exos[i] !== e.nom) { c.exos[i] = e.nom; changed = true; }
    while (sets.length > e.series && !sets[sets.length - 1].done) { sets.pop(); changed = true; }
    while (sets.length < e.series) { const l = last && last.sets[i] && last.sets[i][sets.length]; sets.push({ w: l ? l.w : "", r: l ? l.r : "", done: false }); changed = true; }
  });
  if (c.sets.length > s.exos.length) { c.sets.length = s.exos.length; c.exos.length = s.exos.length; changed = true; }
  if (changed) save();
  return c;
}
function renderSeance() {

function bindSeance(s) {

}

function semaine(iso) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - dow(iso)); return d.toISOString().slice(0, 10); }
function jourPlus(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function moyennes() {
  const byW = {};
  Object.entries(S.poids).forEach(([d, kg]) => { const w = semaine(d); (byW[w] = byW[w] || []).push(+kg); });
  const out = Object.entries(byW).map(([w, v]) => ({ w, n: v.length, avg: v.reduce((a, b) => a + b, 0) / v.length }));
  // Moyennes hebdomadaires de la balance connectée (fichier d'ajout) : elles valent une semaine complète,
  // sauf si la semaine compte déjà au moins 3 pesées saisies dans l'appli.
  Object.entries(S.moyennes || {}).forEach(([w, kg]) => {
    const i = out.findIndex(m => m.w === w), m = { w, n: 7, avg: +kg, ext: true };
    if (i < 0) out.push(m); else if (out[i].n < 3) out[i] = m;
  });
  return out.sort((a, b) => a.w < b.w ? -1 : 1);
}
// Fichier d'ajout { carnetAjout: 1, moyennes: {lundi: kg}, poids: {jour: kg}, taille: {jour: cm}, mensurations: {jour: {cou, poitrine, bicepsG…}} } :
// fusionne dans les données existantes. Séances, repas et courses ne sont jamais touchés.
function fusionner(d) {
  const iso = /^\d{4}-\d{2}-\d{2}$/; let n = 0;
  S.moyennes = S.moyennes || {};
  Object.entries(d.moyennes || {}).forEach(([w, kg]) => { if (iso.test(w) && +kg > 30 && +kg < 250) { S.moyennes[semaine(w)] = +kg; n++; } });
  ["poids", "taille"].forEach(k => Object.entries(d[k] || {}).forEach(([j, v]) => { if (iso.test(j) && S[k][j] == null && +v > 0) { S[k][j] = +v; n++; } }));
  S.compo = S.compo || {};
  Object.entries(d.compo || {}).forEach(([w, c]) => { if (iso.test(w) && c && +c.g > 2 && +c.g < 60 && +c.m > 10 && +c.m < 150) { S.compo[semaine(w)] = { g: +c.g, m: +c.m }; n++; } });
  // Mensurations (cm) : une entrée par date, les valeurs d'une même date se complètent ou se corrigent
  S.mensurations = S.mensurations || {};
  Object.entries(d.mensurations || {}).forEach(([j, m]) => {
    if (!iso.test(j) || !m || typeof m !== "object") return;
    const cur = S.mensurations[j] || {};
    Object.entries(m).forEach(([k, v]) => { if (+v > 5 && +v < 250) { cur[k] = +v; n++; } });
    if (Object.keys(cur).length) S.mensurations[j] = cur;
    if (cur.taille && S.taille[j] == null) S.taille[j] = cur.taille;
  });
  if (d.avis && iso.test(d.avis.date || "") && d.avis.texte) { S.avis = { date: d.avis.date, texte: [].concat(d.avis.texte).map(String) }; n++; }
  save();
  return n ? n + " mesure" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "") : "Rien de nouveau dans ce fichier";
}
function verdict(ms) {
  if (ms.length < 2) return { cls: "", t: "Premier repère", m: `Il faut deux semaines de pesées pour comparer. Pèse-toi chaque matin, la moyenne fait le reste.` };
  const a = ms[ms.length - 2], b = ms[ms.length - 1];
  if (b.n < 3) return { cls: "", t: "Semaine en cours", m: `${b.n} pesée${b.n > 1 ? "s" : ""} cette semaine. Le verdict tombe à partir de 3.` };
  const d = Math.round((b.avg - a.avg) * 1000);
  const sign = d > 0 ? "+" : "";
  if (d > 500) return { cls: "warn", t: `${sign}${d} g cette semaine`, m: "Trop vite : au-delà de +500 g, c'est du gras. Retire 150 kcal — 40 g de riz cru en moins au dîner." };
  if (d >= 200) return { cls: "ok", t: `${sign}${d} g cette semaine`, m: "Dans la cible. Ne touche à rien : c'est du muscle avec un peu de gras, la proportion normale." };
  if (d >= 150) return { cls: "ok", t: `${sign}${d} g cette semaine`, m: "Un peu en dessous de la cible, mais encore dans le bruit. Attends une semaine de plus avant d'ajuster." };
  return { cls: "warn", t: `${sign}${d} g cette semaine`, m: "Sous +150 g. Si c'est la troisième semaine de suite, ajoute 150 kcal : 40 g de riz cru au dîner, ou 50 g de dattes avec le shake de 10 h." };
}
function spark(pts) {
  if (pts.length < 2) return "";
  const W = 480, H = 120, P = 8;
  const xs = pts.map((_, i) => P + i * (W - 2 * P) / (pts.length - 1));
  const vs = pts.map(p => p.v), lo = Math.min(...vs) - 0.3, hi = Math.max(...vs) + 0.3;
  const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const path = pts.map((p, i) => (i ? "L" : "M") + xs[i].toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = path + ` L${xs[xs.length - 1].toFixed(1)} ${H - P} L${xs[0]} ${H - P} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="var(--blue-tint)"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${xs[i].toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="var(--blue)"/>`).join("")}
    <text x="${P}" y="${H - 1}" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${lo.toFixed(1)}</text><text x="${P}" y="11" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${hi.toFixed(1)}</text></svg>`;
}

  const iso = today(), ms = moyennes(), v = verdict(ms);
  const pts = Object.entries(S.poids).map(([d, kg]) => ({ d, v: +kg }))
    .concat(ms.filter(m => m.ext && !Object.keys(S.poids).some(d => semaine(d) === m.w)).map(m => ({ d: jourPlus(m.w, 3), v: m.avg })))
    .sort((a, b) => a.d < b.d ? -1 : 1).slice(-42);
  const last = pts.length ? pts[pts.length - 1].v : null, kg = v => (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, "");
  let h = `<div class="top"><div class="row"><div><div class="eyebrow">${esc(DATA.profil.objectif)} · cible ${esc(DATA.profil.cible)}</div><h1>Suivi</h1></div>${last != null ? `<span class="pill-kg">${kg(last).replace(".", ",")} <small>kg</small></span>` : ""}</div></div>
  <div class="card"><div class="card-b">
    <div class="field"><label for="poids">Poids ce matin, à jeun (kg)</label>
      <div class="stepper" style="min-height:52px"><button data-p="-0.1">−</button><span class="u" data-u="kg"><input id="poids" inputmode="decimal" placeholder="${last != null ? kg(last) : "70,0"}" value="${S.poids[iso] || ""}"></span><button data-p="0.1">+</button></div></div>
    <button class="btn primary" id="save-poids">Enregistrer</button>
  </div></div>
  <div class="verdict ${v.cls}"><span class="eyebrow">Verdict de la semaine</span><span class="big">${esc(v.t)}</span>${esc(v.m)}</div>
  ${avisCard()}
  ${pts.length > 1 ? `<div class="card"><div class="card-h"><h3>6 dernières semaines</h3><span class="hist">${pts.length} mesures</span></div><div class="card-b">${spark(pts)}
    ${ms.slice(-6).reverse().map(m => `<div class="rowline"><span class="d">sem. du ${fmtDate(m.w)}</span><span class="v">${m.avg.toFixed(2)} kg <span class="hist">· ${m.ext ? "moyenne balance" : m.n + " pesée" + (m.n > 1 ? "s" : "")}</span></span></div>`).join("")}</div></div>` : ""}
  ${compoCard(ms)}
  <div class="card"><div class="card-b">
    <div class="field"><label for="taille">Tour de taille au nombril, le lundi (cm)</label>
      <div class="stepper" style="min-height:52px"><button data-t="-0.5">−</button><span class="u" data-u="cm"><input id="taille" inputmode="decimal" placeholder="${Object.keys(S.taille).sort().pop() ? S.taille[Object.keys(S.taille).sort().pop()] : "cm"}" value="${S.taille[iso] || ""}"></span><button data-t="0.5">+</button></div></div>
    <button class="btn ghost" id="save-taille">Enregistrer le tour de taille</button>
    ${Object.keys(S.taille).length ? `<div style="margin-top:10px">${Object.entries(S.taille).sort().slice(-6).reverse().map(([d, c]) => `<div class="rowline"><span class="d">${fmtDate(d)}</span><span class="v">${c} cm</span></div>`).join("")}</div>` : ""}
  </div></div>
  ${mensurationsCard()}`;
  // progression des charges
  const prog = [];
  DATA.seances.forEach(s => (S.seances[s.id] || []).forEach(x => s.exos.forEach((e, i) => {
    if (e.charge === "élastique") return;  // un niveau d'élastique n'est pas une charge
    const best = (x.sets[i] || []).filter(q => q.done && +q.r).reduce((m, q) => Math.max(m, (+q.w || 0) * (+q.r || 0)), 0);
    if (best) prog.push({ exo: e.nom, date: x.date, best, w: Math.max(...x.sets[i].filter(q => q.done).map(q => +q.w || 0)) });
  })));
  const byExo = {}; prog.forEach(p => (byExo[p.exo] = byExo[p.exo] || []).push(p));
  const exos = Object.entries(byExo).filter(([, l]) => l.length >= 1);
  if (exos.length) {
    h += `<div class="card"><div class="card-h"><h3>Progression des charges</h3><span class="hist">meilleure série · kg × reps</span></div><div class="card-b">`;
    exos.forEach(([nom, l]) => {
      const last6 = l.slice(-6), mx = Math.max(...last6.map(p => p.best));
      h += `<div style="margin:8px 0 12px"><div style="font-weight:600;font-size:14px;margin-bottom:5px">${esc(nom)}</div><div class="bars">${last6.map(p => `<div class="bar"><span class="d">${fmtDate(p.date).replace(/^\w+\.?\s/, "")}</span><span class="t"><i style="width:${Math.round(p.best / mx * 100)}%"></i></span><span class="v">${p.w} kg · ${p.best}</span></div>`).join("")}</div></div>`;
    });
    h += `</div></div>`;
  } else h += `<p class="empty">La progression des charges apparaîtra ici après ta première séance enregistrée.</p>`;
  h += `<details class="card"><summary class="card-h"><h3>Règles de pilotage</h3></summary><div class="card-b">${DATA.pilotage.map(p => `<div class="rowline" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="v" style="color:${p.alerte ? "var(--clay)" : "var(--green)"};font-size:13px">${esc(p.cond)}</span><span style="font-size:13.5px;color:var(--ink-2)">${esc(p.texte)}</span></div>`).join("")}</div></details>
  <details class="card"><summary class="card-h"><h3>Échelle de douleur (épaule)</h3></summary><div class="card-b">${DATA.douleur.map(p => `<div class="rowline" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="v" style="color:${p.consulter ? "var(--clay)" : "var(--green)"};font-size:13px">${esc(p.situation)}</span><span style="font-size:13.5px;color:var(--ink-2)">${esc(p.texte)}</span></div>`).join("")}</div></details>
  <div style="display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap"><button class="btn ghost small" id="export">Exporter mes données</button><button class="btn ghost small" id="import">Importer</button><button class="btn ghost small" id="recup">Récupérer mes mesures</button><input type="file" id="import-file" accept="application/json" hidden></div>
  <div class="card" style="margin-bottom:24px"><div class="card-h"><h3>Carnet</h3><span class="hist">plan du ${esc(DATA.version)}${window.Android && Android.build ? ` · version ${esc(Android.build())}` : ""}</span></div>
    <div class="card-b"><p class="hist" style="margin:0 0 12px">Données stockées sur ce téléphone uniquement — exporte-les de temps en temps.${window.Android && Android.checkUpdate ? " Les mises à jour s'installent toutes seules à l'ouverture ; ce bouton force la vérification." : ""}</p>
    ${window.Android && Android.checkUpdate ? `<button class="btn ghost small" id="check-update">Vérifier les mises à jour</button>` : ""}</div></div>`;
  app.innerHTML = h;
  const pi = document.getElementById("poids"), ti = document.getElementById("taille");
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { pi.value = (Math.round(((parseFloat(pi.value.replace(",", ".")) || parseFloat(pi.placeholder.replace(",", ".")) || 70) + +b.dataset.p) * 10) / 10).toFixed(1); });
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { ti.value = (Math.round(((parseFloat(ti.value.replace(",", ".")) || parseFloat(ti.placeholder) || 80) + +b.dataset.t) * 10) / 10).toFixed(1); });
  document.getElementById("save-poids").onclick = () => { const v = parseFloat(pi.value.replace(",", ".")); if (!v || v < 30 || v > 250) return toast("Poids invalide"); S.poids[iso] = v; save(); toast("Pesée enregistrée"); renderSuivi(); };
  document.getElementById("save-taille").onclick = () => { const v = parseFloat(ti.value.replace(",", ".")); if (!v || v < 40 || v > 200) return toast("Mesure invalide"); S.taille[iso] = v; save(); toast("Tour de taille enregistré"); renderSuivi(); };
  document.getElementById("export").onclick = () => {
    const json = JSON.stringify(S, null, 1);
    if (window.Android && Android.saveFile) { Android.saveFile("carnet-" + iso + ".json", json); return; }
    const blob = new Blob([json], { type: "application/json" }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "carnet-" + iso + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const cu = document.getElementById("check-update");
  if (cu) cu.onclick = () => { toast("Vérification…"); Android.checkUpdate(); };
  const fi = document.getElementById("import-file");
  document.getElementById("import").onclick = () => fi.click();
  document.getElementById("recup").onclick = () => { toast("Recherche…"); recupererMesures(true); };
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (d.carnetAjout) { toast(fusionner(d)); render(); return; } if (!d.seances) throw 0; S = Object.assign(load(), d); save(); toast("Données importées"); render(); } catch (e) { toast("Fichier invalide"); } }; r.readAsText(f); };
}

// ============================================================ démarrage
render();
recupererMesures(false);
if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Android) navigator.serviceWorker.register("sw.js").catch(() => {});
// Bouton Retour Android : revient à l'onglet Séance, sinon laisse l'appli se fermer.
window.androidBack = () => { if (S.tab !== "seance") { S.tab = "seance"; save(); render(); return true; } return false; };
// Mise à jour automatique (appli Android) : Android prévient quand une nouvelle version est téléchargée.
const upd = document.getElementById("update");
document.getElementById("update-go").onclick = () => { upd.hidden = true; save(); Android.reload(); };
window.carnetUpdateReady = () => { upd.hidden = false; };
window.carnetUpdateNone = () => toast("Déjà à jour");
window.carnetUpdateError = () => toast("Vérification impossible (pas de réseau ?)");
</script>
</body>
</html>
